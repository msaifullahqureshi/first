<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city, country or state" spellcheck="false">
            <button><i class="ri-search-line searchbtn"></i></button>
        </div>
        <div class="errors">
            <div class="propername">
                <p><strong>enter any city, country or state's name</strong></p>
                <p>E.g(Karachi, Pakistan, Texas)</p>
            </div>
            <div class="spelling">
                <p><strong>*Enter correct spelling</strong></p>
            </div>
        </div>
        <div class="weather">
            <img src="Images/rain.png" class="weather-icon" alt="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">Karachi</h2>
            <div class="details">
                <div class="col">
                    <img src="Images/humidity.png" alt="">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="Images/wind.png" alt="">
                    <div>
                        <p class="wind">15km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
